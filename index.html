<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trimera Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            trimera: {
              gold: '#C4922F', // Antique Gold from "TRIMERA" text
              goldHover: '#A87A22',
              forest: '#1F2F1F', // Dark Deep Moss/Shadow Green
              forestLight: '#4E6E34', // Leafy Olive Green
              stone: '#EFE8D1', // Warm Parchment/Beige Background
              stoneDark: '#D6CDB8', // Darker Beige for borders
              bark: '#7A5835', // Castle/Tree Trunk Brown
              textMain: '#2A2520', // Very dark brown/black for text
            }
          },
          fontFamily: {
            logo: ['"Cinzel"', 'serif'],
            title: ['"MedievalSharp"', 'cursive'],
            body: ['"Libre Baskerville"', 'serif'],
            ui: ['"Lato"', 'sans-serif'],
          },
          backgroundImage: {
            'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.08%22/%3E%3C/svg%3E')",
            'forest-gradient': "linear-gradient(to bottom, rgba(31, 47, 31, 0.9), rgba(78, 110, 52, 0.7))",
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth Scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Custom Scrollbar - Matte Look */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #EFE8D1;
    }

    ::-webkit-scrollbar-thumb {
      background: #C4922F;
      border-radius: 5px;
      border: 2px solid #EFE8D1;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #7A5835;
    }

    .text-readability {
      line-height: 1.8;
      letter-spacing: 0.01em;
    }

    .stone-texture {
      background-color: #EFE8D1;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    }

    /* Page Transition Animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-transition {
      animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-trimera-stone text-trimera-textMain font-body">
  <div id="root"></div>
  <script type="module" src="/frontend/index.tsx"></script>
</body>

</html>
